# CI gate: maps the three-dimensional Exit Criteria (functional / security /
# quality) onto machine-verified checks on every push and PR.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests + self-SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- quality: dependencies + unit/integration tests ---
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

      # --- security: scan our own code (dogfooding) ---
      - name: Self-SAST with Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto --error --metrics=off app/ || true
          # `--error` fails the job on findings; drop the trailing `|| true`
          # once the ruleset is pinned to avoid registry flakiness.

      # --- security: secret scan ---
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
