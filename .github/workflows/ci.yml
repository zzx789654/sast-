# CI gate: maps the three-dimensional Exit Criteria (functional / security /
# quality) onto machine-verified checks on every push and PR.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- quality: dependencies + unit/integration tests ---
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  security:
    name: Full security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OSV_SCANNER_VERSION: "1.9.2"
      TRIVY_VERSION: "0.74.0"
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pip-audit semgrep
          mkdir -p "$RUNNER_TEMP/security-tools" reports

          curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -o "$RUNNER_TEMP/security-tools/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/security-tools/osv-scanner"

          curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -o "$RUNNER_TEMP/security-tools/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf "$RUNNER_TEMP/security-tools/trivy.tgz" \
            -C "$RUNNER_TEMP/security-tools" trivy
          chmod +x "$RUNNER_TEMP/security-tools/trivy"

          curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -o "$RUNNER_TEMP/security-tools/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/security-tools/gitleaks.tgz" \
            -C "$RUNNER_TEMP/security-tools" gitleaks
          chmod +x "$RUNNER_TEMP/security-tools/gitleaks"

          curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/security-tools"

      # Findings are reported and uploaded as artifacts. The first rollout is
      # non-blocking so all scanners can complete and the team can set policy
      # thresholds from real project results.
      - name: Run complete security scan
        shell: bash
        run: |
          set -u
          : > reports/summary.txt

          run_scan() {
            local name="$1"
            shift
            set +e
            "$@" >"reports/${name}.log" 2>&1
            local status=$?
            set -e
            printf '%s: %s\n' "$name" "$status" | tee -a reports/summary.txt
            if [ "$status" -ne 0 ]; then
              echo "::warning title=${name}::scanner exited with status ${status}; see the report artifact"
            fi
          }

          # Source code scan without telemetry. Explicit language rules avoid
          # Semgrep's auto-config metrics requirement while covering this repo.
          run_scan semgrep semgrep scan --config p/python --config p/javascript \
            --error --metrics=off --json .

          # Python dependency scan of the complete installed environment.
          run_scan pip-audit pip-audit --progress-spinner off --format json

          # Multi-ecosystem dependency scan (requirements.txt and any supported
          # manifests supplied by the repository).
          run_scan osv-scanner "$RUNNER_TEMP/security-tools/osv-scanner" \
            --format json -r .

          # Secrets plus IaC/configuration and filesystem dependency scan.
          run_scan trivy-fs "$RUNNER_TEMP/security-tools/trivy" fs \
            --scanners vuln,secret,misconfig --exit-code 1 --no-progress \
            --format json .

          # Gitleaks scans the complete repository, including CI and docs.
          run_scan gitleaks "$RUNNER_TEMP/security-tools/gitleaks" detect \
            --source . --no-banner --report-format json \
            --report-path reports/gitleaks.json

          # Bearer scans application code for data-flow and sensitive-data risks.
          run_scan bearer "$RUNNER_TEMP/security-tools/bearer" scan . \
            --format json --quiet --exit-code 0 --force

          if [ -f package.json ]; then
            run_scan npm-audit npm audit --json
          else
            echo "npm-audit: skipped (no package.json)" | tee -a reports/summary.txt
          fi

          # Build the production image and scan its OS/Python/runtime layers.
          run_scan docker-build docker build -t sast-studio:ci .
          if docker image inspect sast-studio:ci >/dev/null 2>&1; then
            run_scan trivy-image "$RUNNER_TEMP/security-tools/trivy" image \
              --scanners vuln,secret --exit-code 1 --no-progress --format json \
              sast-studio:ci
          else
            echo "trivy-image: skipped (Docker build failed)" | tee -a reports/summary.txt
          fi

      - name: Publish security scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
