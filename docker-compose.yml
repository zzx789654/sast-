# Free on Linux servers (Docker Engine + Compose are Apache-2.0).
# Brings up SAST Studio with all six free scanners pre-installed:
# Semgrep, Bearer, Trivy, npm audit, OSV-Scanner and Gitleaks.
#
# nginx is the public entry point (http://localhost:8080) and reverse-proxies
# to the FastAPI backend, which is not published to the host directly.
services:
  sast-studio:
    build:
      context: .
      args:
        PIP_TIMEOUT: ${PIP_TIMEOUT:-600}
        PIP_RETRIES: ${PIP_RETRIES:-10}
    image: sast-studio:latest
    # Internal only — reachable by nginx over the compose network, not the host.
    expose:
      - "8000"
    environment:
      # Registry ruleset; needs network. Pin a local ruleset path for
      # fully-offline use. Do not set "auto": semgrep rejects it because we
      # scan with --metrics=off (no code data leaves this host).
      SAST_SEMGREP_RULES: "p/default"
      SAST_ALLOW_LOCAL_PATH: "true"
      SAST_TOOL_TIMEOUT: "900"
      # Monitor tab — per-container CPU/memory. Reads the docker socket that is
      # mounted read-only below. That mount is a privileged capability, so this
      # whole compose file assumes a trusted, non-public host.
      SAST_ENABLE_DOCKER_STATS: "true"
    volumes:
      - sast-workspaces:/data/workspaces
      # Scan code that already lives on the host by mounting it read-only and
      # using the "Local path" tab with e.g. /mounted/my-project.
      # - ./my-project:/mounted/my-project:ro
      #
      # Required for the Monitor tab. Read-only: enough to read container stats,
      # not to start, stop or create containers. Still a privileged capability —
      # a process that can read this socket can see every container on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The socket is owned by root:docker and the app runs as a non-root user,
    # so it needs that group to read it. The gid differs per host (988 here,
    # 999 elsewhere), which is why it comes from the environment:
    # scripts/deploy.sh writes the host's real gid into .env before building.
    # Without this the Monitor tab reports "permission denied".
    group_add:
      - "${DOCKER_GID:-999}"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      # Host 8080 -> nginx 80. Change to "80:80" to serve on the standard port.
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sast-studio
    restart: unless-stopped

volumes:
  sast-workspaces:
