# Free on Linux servers (Docker Engine + Compose are Apache-2.0).
# Brings up SAST Studio with all six free scanners pre-installed:
# Semgrep, Bearer, Trivy, npm audit, OSV-Scanner and Gitleaks.
#
# nginx is the public entry point (http://localhost:8080) and reverse-proxies
# to the FastAPI backend, which is not published to the host directly.
services:
  sast-studio:
    # Fixed names: the docker proxy answers questions about these three
    # containers only (nginx/docker-proxy.conf). The project name, and with
    # it every named volume, is unchanged.
    container_name: sast-studio
    build:
      context: .
      args:
        PIP_TIMEOUT: ${PIP_TIMEOUT:-600}
        PIP_RETRIES: ${PIP_RETRIES:-10}
    image: sast-studio:latest
    # Internal only — reachable by nginx over the compose network, not the host.
    expose:
      - "8000"
    environment:
      # Registry ruleset; needs network. Pin a local ruleset path for
      # fully-offline use. Do not set "auto": semgrep rejects it because we
      # scan with --metrics=off (no code data leaves this host).
      SAST_SEMGREP_RULES: "p/default"
      # Custom rules written in the UI live on the volume below, so they
      # survive restarts and image rebuilds.
      SAST_RULES_DIR: "/data/rules"
      # Accounts. On by default now: the maintenance actions and the API run
      # commands on this host, and nothing else establishes who is asking.
      SAST_REQUIRE_AUTH: "true"
      SAST_ACCOUNTS_DB: "/data/accounts/accounts.db"
      # The address this deployment is reached at. Generated MCP/.env files
      # tell a client where to send its token, so that address must not be
      # worked out from a request header the caller controls. Set this to
      # your own URL; the allow-list below is the fallback when it is unset.
      SAST_PUBLIC_URL: "${SAST_PUBLIC_URL:-}"
      SAST_ALLOWED_HOSTS: "${SAST_ALLOWED_HOSTS:-}"
      SAST_ALLOW_LOCAL_PATH: "true"
      SAST_TOOL_TIMEOUT: "900"
      # Monitor tab — per-container CPU/memory, read through docker-proxy
      # below. This container has no docker socket: one mounted ":ro" still
      # accepts every API call, including ones that start containers, which
      # is control of the host.
      SAST_ENABLE_DOCKER_STATS: "true"
      SAST_DOCKER_PROXY: "docker-proxy:2375"
      SAST_CONTAINER_NAME: "sast-studio"
      # Scanner upgrades from the Monitor tab: this app writes a request here
      # and scripts/sast_updater.py, on the host, does the work.
      SAST_OPS_DIR: "/data/ops"
      # "false" in .env: no version questions to GitHub or PyPI, from here or
      # from the host updater (which reads .env itself).
      SAST_UPSTREAM_CHECK: "${SAST_UPSTREAM_CHECK:-true}"
    volumes:
      # Two volumes, not one: filling the rules directory must not take the
      # scan workspaces down with it, and vice versa.
      - sast-workspaces:/data/workspaces
      - sast-rules:/data/rules
      - sast-accounts:/data/accounts
      # Scan code that already lives on the host by mounting it read-only and
      # using the "Local path" tab with e.g. /mounted/my-project.
      # - ./my-project:/mounted/my-project:ro
      #
      # Upgrade requests and their progress (see SAST_OPS_DIR). Created by
      # scripts/install-updater.sh; holds no credentials.
      - ./ops:/data/ops
    depends_on:
      - docker-proxy
    restart: unless-stopped

  # The Docker API for the Monitor tab: four read-only paths (container list,
  # one container's details and stats, engine info), 403 for everything else
  # -- no writes, no container files, no logs. See nginx/docker-proxy.conf.
  # Not published to the host.
  docker-proxy:
    container_name: sast-docker-proxy
    # Pinned by digest: this container holds the docker socket.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ./nginx/docker-proxy.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    restart: unless-stopped

  nginx:
    container_name: sast-nginx
    image: nginx:1.27-alpine
    ports:
      # Host 8080 -> nginx 80. Change to "80:80" to serve on the standard port.
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sast-studio
    restart: unless-stopped

volumes:
  sast-workspaces:
  sast-rules:
  sast-accounts:
