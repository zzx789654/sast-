<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAST Studio — 登入</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">🛡</span>
      <h1>SAST Studio</h1>
    </div>

    <form id="login-form" autocomplete="on">
      <label class="field">
        <span data-i18n="login.user">使用者名稱</span>
        <input id="login-user" name="username" autocomplete="username"
               autocapitalize="off" autocorrect="off" required autofocus>
      </label>
      <label class="field">
        <span data-i18n="login.pass">密碼</span>
        <input id="login-pass" name="password" type="password"
               autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary" data-i18n="login.submit">登入</button>
      <p id="login-error" class="error hidden" role="alert"></p>
      <p id="login-note" class="login-note hidden" role="status"></p>
    </form>

    <!-- An expired password cannot be changed from the settings page,
         because reaching that page is exactly what it is not allowed to do.
         So the change happens here, still proving the current password. -->
    <form id="expired-form" class="hidden">
      <p class="login-note" data-i18n="login.expiredNote"></p>
      <p id="expired-rules" class="login-rules"></p>
      <label class="field">
        <span data-i18n="settings.newPw">新密碼</span>
        <input id="expired-new" type="password" autocomplete="new-password"
               required>
      </label>
      <label class="field">
        <span data-i18n="settings.confirmPw">再輸入一次</span>
        <input id="expired-confirm" type="password"
               autocomplete="new-password" required>
      </label>
      <button type="submit" class="primary"
              data-i18n="settings.changePw">變更密碼</button>
      <p id="expired-error" class="error hidden" role="alert"></p>
    </form>
  </main>

  <script src="/i18n.js"></script>
  <script src="/login.js"></script>
</body>
</html>
