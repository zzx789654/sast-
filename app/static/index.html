<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAST Studio</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🛡️</span>
      <div>
        <h1>SAST Studio</h1>
        <p class="tagline" data-i18n="tagline">一頁搞定六個免費資安掃描器。</p>
      </div>
    </div>
    <div class="topbar-right">
      <div id="tool-status" class="tool-status" aria-label="tool availability"></div>
      <button id="lang-toggle" class="lang-toggle" title="切換語言 / switch language">EN</button>
    </div>
  </header>

  <nav class="viewnav" role="tablist">
    <button class="viewtab active" data-view="scan" data-i18n="nav.scan">掃描</button>
    <button class="viewtab" data-view="report" data-i18n="nav.report">報告</button>
    <button class="viewtab" data-view="monitor" data-i18n="nav.monitor">監控</button>
  </nav>

  <main id="view-scan" class="layout layout-single">
    <!-- ---- scan configuration ------------------------------------- -->
    <section class="panel" aria-labelledby="new-scan-h">
      <h2 id="new-scan-h" data-i18n="sec.newScan">新增掃描</h2>

      <div class="tabs" role="tablist">
        <button class="tab active" data-kind="upload" role="tab" data-i18n="tab.upload">上傳 zip</button>
        <button class="tab" data-kind="git" role="tab" data-i18n="tab.git">Git 網址</button>
        <button class="tab" data-kind="path" role="tab" data-i18n="tab.path">本機路徑</button>
      </div>

      <div class="tabpane" data-pane="upload">
        <label class="field">
          <span data-i18n="field.upload">原始碼壓縮檔（.zip）</span>
          <input type="file" id="file-input" accept=".zip" />
        </label>
      </div>
      <div class="tabpane hidden" data-pane="git">
        <label class="field">
          <span data-i18n="field.git">儲存庫網址（http/https）</span>
          <input type="text" id="git-input" placeholder="https://github.com/org/repo" />
        </label>
      </div>
      <div class="tabpane hidden" data-pane="path">
        <label class="field">
          <span data-i18n="field.path">伺服器本機目錄路徑</span>
          <input type="text" id="path-input" placeholder="/srv/code/my-project" />
        </label>
        <button type="button" id="inspect-btn" class="linkbtn" data-i18n="btn.inspect">檢查專案</button>
        <p id="path-note" class="note hidden" data-i18n="pathNote">本機路徑掃描已被設定停用。</p>
      </div>

      <div id="inspect-panel" class="inspect-panel hidden"></div>

      <fieldset class="tools-pick">
        <legend data-i18n="sec.tools">工具</legend>
        <div id="tool-checkboxes"></div>
        <button type="button" id="select-all" class="linkbtn" data-i18n="btn.selectAll">全選可用工具</button>
      </fieldset>

      <div id="tool-warnings" class="tool-warnings hidden"></div>

      <!-- The judgement rule is fixed, so it is stated rather than offered
           as a choice: one line, no controls, no decision to make. -->
      <p id="verdict-rule" class="verdict-rule"></p>

      <button id="start-btn" class="primary" data-i18n="btn.start">開始掃描</button>
      <p id="form-error" class="error hidden" role="alert"></p>
    </section>

  </main>


  <!-- ---- report view (scan history + detail) --------------------- -->
  <section id="view-report" class="report-wrap hidden">
    <aside class="panel report-list-panel">
      <div class="results-head">
        <h2 data-i18n="sec.reports">掃描報告</h2>
        <button id="report-refresh" class="linkbtn" data-i18n="mon.refresh">重新整理</button>
      </div>
      <div id="report-list" class="report-list"></div>
    </aside>

    <section class="panel report-detail-panel" aria-labelledby="results-h">
      <div class="results-head">
        <h2 id="results-h" data-i18n="sec.results">結果</h2>
        <div class="export-btns">
          <button id="export-csv" class="linkbtn" data-i18n="export.csv">匯出 CSV</button>
          <button id="export-pdf" class="linkbtn" data-i18n="export.pdf">匯出 PDF</button>
        </div>
      </div>

      <div id="scan-meta" class="scan-meta"></div>

      <!-- severity breakdown as a single proportional bar -->
      <div id="sev-bar-wrap" class="sev-bar-wrap hidden">
        <div id="sev-bar" class="sev-bar" role="img"></div>
        <div id="sev-bar-legend" class="sev-bar-legend"></div>
      </div>

      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress-head">
          <span id="progress-label"></span>
          <span id="progress-count"></span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div id="confirm-box" class="confirm-box hidden"></div>

      <div id="summary" class="summary"></div>
      <div id="tool-results" class="tool-results"></div>

      <div class="filters">
        <select id="filter-severity"></select>
        <select id="filter-tool"></select>
        <input type="text" id="filter-file" data-i18n-ph="ph.filter" placeholder="依檔名篩選…" />
      </div>

      <div id="findings" class="findings"></div>
    </section>
  </section>

  <!-- ---- monitor view ------------------------------------------- -->
  <section id="view-monitor" class="monitor-wrap hidden">
    <div class="panel">
      <div class="mon-head">
        <h2 data-i18n="mon.tools">掃描工具版本</h2>
        <button id="mon-refresh" class="linkbtn" data-i18n="mon.refresh">重新整理</button>
      </div>
      <p class="mon-hint" data-i18n="mon.updateHint"></p>
      <div id="mon-tools" class="mon-tools"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="mon.containers">Docker 容器效能</h2>
      <div id="mon-docker"></div>
    </div>
    <div class="panel" id="admin-panel">
      <div class="mon-head">
        <h2 data-i18n="admin.title">維護動作</h2>
        <span id="admin-state" class="admin-state"></span>
      </div>
      <p class="mon-hint" data-i18n="admin.warn"></p>
      <div class="admin-actions">
        <button id="admin-update" class="btn" data-i18n="admin.update">更新掃描工具</button>
        <button id="admin-restart" class="btn ghost" data-i18n="admin.restart">重啟服務</button>
      </div>
      <p class="mon-subnote" id="admin-updatable"></p>
      <div id="admin-outcome" class="admin-outcome hidden"></div>
      <pre id="admin-log" class="admin-log hidden"></pre>
    </div>
  </section>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
