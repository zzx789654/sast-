# The Docker API for the Monitor tab, and only the parts it reads.
#
# The app container has no docker socket. It reaches the API through this
# proxy, which answers four read-only paths and refuses everything else:
# the container list, one container's details and stats, and engine info.
# A path the Monitor tab does not use -- a container's files (/archive,
# /export), its logs, exec, anything that writes -- gets 403, so a
# compromised app cannot read other containers' filesystems or logs.
#
# Runs as root only because the socket is root:docker; the container has
# nothing else to protect.
user root;
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  access_log off;
  server {
    listen 2375;

    # The location below matches the normalised path, but proxy_pass
    # forwards the request line as the client sent it. Refuse anything
    # where the two could differ -- encoded characters, "..", "//" -- so
    # what passes the check is exactly what Docker receives. Path only: the
    # query is not matched by the location, and the app's own filter is
    # percent-encoded JSON.
    if ($request_uri ~ "^[^?]*(%|\.\.|//)") {
      return 403;
    }

    location ~ ^/(containers/json|containers/[A-Za-z0-9_.-]+/(json|stats)|info)$ {
      limit_except GET { deny all; }
      proxy_pass http://unix:/var/run/docker.sock:;
    }

    location / {
      return 403;
    }
  }
}
