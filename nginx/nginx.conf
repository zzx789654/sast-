# Reverse proxy in front of the SAST Studio FastAPI backend.
# nginx terminates client connections and forwards to uvicorn over the
# internal Docker network; the backend is never published directly.

upstream sast_backend {
    server sast-studio:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads can be large (a whole source archive). Keep this in step with
    # SAST_MAX_UPLOAD_BYTES on the backend (default 200 MB).
    client_max_body_size 200m;

    # A scan can take a while; don't cut the connection while the backend
    # streams the upload or a slow request completes.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        proxy_pass http://sast_backend;
        proxy_http_version 1.1;
        # A fixed value, not the client's Host header. That header is
        # attacker-controlled, and nothing here builds links from it today,
        # but passing it through means the first feature that does would
        # inherit the problem.
        #
        # The variable is not named here on purpose: semgrep's
        # request-host-used rule matches the text, comments included, so
        # writing it even to explain why it is avoided re-triggers the rule.
        proxy_set_header Host              sast-studio;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Lightweight health endpoint for load balancers / uptime checks.
    location = /healthz {
        proxy_pass http://sast_backend/api/health;
        access_log off;
    }
}
